name: Skill quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate zero-debt catalogue
        run: python -X utf8 scripts/validate_skill_engine.py --baseline docs/quality/skill-quality-baseline.json
      - name: Test routing
        run: python -X utf8 scripts/routing_smoke_test.py --threshold 1.0
      - name: Validate evidence and sector gates
        run: |
          python -X utf8 tools/evidence-register/refresh_evidence_register.py --check
          python -X utf8 tools/sector-gates/validate_sector_gates.py
      - name: Validate workbooks and audience packs
        run: |
          python -X utf8 scripts/build-financial-models/verify_workbooks.py
          python -X utf8 tools/exemplar-packs/validate_exemplar_packs.py
      - name: Run capability regression tests
        run: python -X utf8 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python quality tools
        run: python -m compileall -q scripts tools skills/meta-utility/skill-writing/scripts
