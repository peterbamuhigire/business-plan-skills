name: Skill quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate zero-debt catalogue
        run: python -X utf8 scripts/validate_skill_engine.py --baseline docs/quality/skill-quality-baseline.json
      - name: Test routing
        run: python -X utf8 scripts/routing_smoke_test.py --threshold 1.0
      - name: Compile Python quality tools
        run: python -m py_compile scripts/validate_skill_engine.py scripts/routing_smoke_test.py skills/meta-utility/skill-writing/scripts/quick_validate.py
